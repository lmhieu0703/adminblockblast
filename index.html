<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Block Blast Siêu Cấp</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0c10; color: #c5c6c7; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #1f2833; padding: 30px; border-radius: 10px; border: 2px solid #66fcf1; box-shadow: 0 0 20px rgba(102, 252, 241, 0.2); }
        
        h1, h2 { color: #66fcf1; text-align: center; letter-spacing: 2px; }
        
        /* Màn hình đăng nhập */
        #login-screen { text-align: center; margin-top: 100px; }
        input[type="password"] { padding: 12px; width: 250px; background: #0b0c10; color: #66fcf1; border: 1px solid #66fcf1; text-align: center; font-size: 16px; border-radius: 5px; outline: none; }
        .btn { padding: 10px 20px; cursor: pointer; border: none; font-weight: bold; border-radius: 5px; font-size: 14px; transition: 0.3s; text-transform: uppercase; }
        .btn-login { background: #66fcf1; color: #0b0c10; margin-top: 15px; }
        .btn-login:hover { box-shadow: 0 0 15px #66fcf1; }

        /* Bảng điều khiển */
        #admin-dashboard { display: none; }
        .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; border-bottom: 2px solid #45a29e; padding-bottom: 10px; }
        .tab-btn { background: transparent; color: #45a29e; border: 1px solid #45a29e; padding: 10px 20px; }
        .tab-btn.active { background: #45a29e; color: #fff; box-shadow: 0 0 10px #45a29e; }
        
        .header-dash { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-action { background: #45a29e; color: #fff; }
        .btn-danger { background: transparent; border: 1px solid #ff4655; color: #ff4655; }
        .btn-danger:hover { background: #ff4655; color: #fff; box-shadow: 0 0 10px #ff4655; }
        .btn-gift { background: #f3ca20; color: #000; border: none; padding: 6px 12px;}
        .btn-gift:hover { box-shadow: 0 0 10px #f3ca20; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #0b0c10; }
        th, td { border: 1px solid #1f2833; padding: 12px; text-align: center; }
        th { background: #111; color: #66fcf1; }
        td { font-size: 16px; }
        
        .input-box { width: 80px; padding: 8px; background: #1f2833; color: #fff; border: 1px solid #45a29e; text-align: center; border-radius: 4px; font-weight: bold; }
        .input-box:focus { border-color: #66fcf1; outline: none; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ĐĂNG NHẬP -->
        <div id="login-screen">
            <h1>ADMIN BLOCK BLAST</h1>
            <p>Nhập mật khẩu quyền lực để vào hệ thống</p>
            <input type="password" id="admin-pass" placeholder="Mật khẩu sếp ơi..."><br>
            <button class="btn btn-login" onclick="checkPassword()">ĐĂNG NHẬP</button>
        </div>

        <!-- BẢNG ĐIỀU KHIỂN -->
        <div id="admin-dashboard">
            <div class="header-dash">
                <h2>HỆ THỐNG ĐIỀU HÀNH</h2>
                <button class="btn btn-danger" onclick="logout()">Thoát an toàn</button>
            </div>
            
            <div class="tabs">
                <button class="btn tab-btn active" onclick="switchTab('players')">👥 Quản Lý Người Chơi</button>
                <button class="btn tab-btn" onclick="switchTab('codes')">🎁 Quản Lý Mã Code</button>
            </div>

            <!-- TAB NGƯỜI CHƠI -->
            <div id="tab-players" class="tab-content active">
                <div style="text-align: right; margin-bottom: 10px;">
                    <button class="btn btn-action" onclick="loadPlayers()">🔄 Làm mới danh sách</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Tên Người Chơi</th>
                            <th>Kỷ Lục Điểm</th>
                            <th>Tiền Đang Có ($)</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="players-body">
                        <!-- Đổ dữ liệu người chơi -->
                    </tbody>
                </table>
            </div>

            <!-- TAB MÃ CODE -->
            <div id="tab-codes" class="tab-content">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <button class="btn btn-gift" onclick="addPromoCode()">➕ Tạo Mã Code Mới</button>
                    <button class="btn btn-action" onclick="loadCodes()">🔄 Làm mới Code</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Mã Nhập (Code)</th>
                            <th>Số Tiền Nhận Được ($)</th>
                            <th>Số Lần Đã Nhập</th>
                            <th>Hành Động</th>
                        </tr>
                    </thead>
                    <tbody id="codes-body">
                        <!-- Đổ dữ liệu Code -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // CẤU HÌNH MÁY CHỦ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDEQLXAKLqYka8RXqJXrOIGTJicHVw2Rjs",
            authDomain: "may-chu-lmh-f42e0.firebaseapp.com",
            databaseURL: "https://may-chu-lmh-f42e0-default-rtdb.firebaseio.com",
            projectId: "may-chu-lmh-f42e0",
            storageBucket: "may-chu-lmh-f42e0.firebasestorage.app",
            messagingSenderId: "498997200625",
            appId: "1:498997200625:web:9a8260bb3e5d35a2264b50"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const MAT_KHAU_ADMIN = "admin_lmh";

        // ================= XỬ LÝ ĐĂNG NHẬP & CHUYỂN TAB =================
        function checkPassword() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === MAT_KHAU_ADMIN) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                loadPlayers();
            } else {
                alert("⛔ Sai mật khẩu!");
            }
        }

        function logout() {
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('admin-dashboard').style.display = 'none';
            document.getElementById('admin-pass').value = '';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');
            
            if(tabName === 'players') loadPlayers();
            if(tabName === 'codes') loadCodes();
        }

        // ================= QUẢN LÝ NGƯỜI CHƠI =================
        function loadPlayers() {
            const tbody = document.getElementById('players-body');
            tbody.innerHTML = '<tr><td colspan="4">Đang tải dữ liệu...</td></tr>';

            database.ref('blockblast/users').once('value', (snapshot) => {
                let html = '';
                let hasData = false;
                
                snapshot.forEach((child) => {
                    hasData = true;
                    const id = child.key;
                    const data = child.val();
                    html += `
                        <tr>
                            <td style="color: #66fcf1; font-weight: bold;">${data.name}</td>
                            <td>
                                <input type="number" id="score_${id}" class="input-box" value="${data.score}">
                                <button class="btn btn-action" style="padding: 6px 10px; margin-left: 5px;" onclick="updateData('${id}', 'score')">Lưu</button>
                            </td>
                            <td>
                                <input type="number" id="money_${id}" class="input-box" value="${data.money}" style="color:#f3ca20;">
                                <button class="btn btn-action" style="padding: 6px 10px; margin-left: 5px;" onclick="updateData('${id}', 'money')">Lưu</button>
                            </td>
                            <td>
                                <button class="btn btn-gift" onclick="sendGift('${id}', '${data.name}')">🎁 Tặng Tiền</button>
                                <button class="btn btn-danger" style="padding: 6px 10px; margin-left: 5px;" onclick="deletePlayer('${id}', '${data.name}')">Xóa</button>
                            </td>
                        </tr>
                    `;
                });

                if(!hasData) html = '<tr><td colspan="4" style="color:#888;">Chưa có người chơi nào</td></tr>';
                tbody.innerHTML = html;
            });
        }

        function updateData(id, type) {
            const val = document.getElementById(`${type}_${id}`).value;
            database.ref(`blockblast/users/${id}`).update({
                [type]: parseInt(val)
            }).then(() => alert("✅ Đã cập nhật thành công!"));
        }

        function deletePlayer(id, name) {
            if(confirm(`⚠️ CẢNH BÁO: Bạn có chắc muốn xóa sổ ${name} không?`)) {
                database.ref(`blockblast/users/${id}`).remove().then(() => {
                    alert("Đã xóa xong!");
                    loadPlayers();
                });
            }
        }

        // Tính năng Tặng Quà Vô Hộp Thư
        function sendGift(id, name) {
            const amount = prompt(`Bạn muốn tặng bao nhiêu $ cho ${name}?`, "50");
            if (!amount || isNaN(amount)) return;
            
            const message = prompt("Kèm theo lời nhắn gì?", "Thưởng nóng từ Admin siêu cấp đập trai!");
            
            // Đẩy quà vào nhánh 'inbox' của người dùng đó
            database.ref(`blockblast/users/${id}/inbox`).push({
                sender: "ADMIN 👑",
                amount: parseInt(amount),
                message: message || "Quà tặng từ Admin",
                timestamp: Date.now(),
                isRead: false
            }).then(() => {
                alert(`✅ Đã gửi thành công ${amount}$ vào hộp thư của ${name}! Khi họ vào game sẽ nhận được thông báo.`);
            });
        }

        // ================= QUẢN LÝ MÃ CODE =================
        function loadCodes() {
            const tbody = document.getElementById('codes-body');
            tbody.innerHTML = '<tr><td colspan="4">Đang tải dữ liệu Code...</td></tr>';

            database.ref('blockblast/codes').once('value', (snapshot) => {
                let html = '';
                let hasData = false;
                
                snapshot.forEach((child) => {
                    hasData = true;
                    const codeStr = child.key;
                    const data = child.val();
                    html += `
                        <tr>
                            <td style="color: #ff4655; font-size: 20px; font-weight: 900; letter-spacing: 2px;">${codeStr}</td>
                            <td style="color: #f3ca20; font-weight: bold;">+${data.amount}$</td>
                            <td>${data.usedBy ? Object.keys(data.usedBy).length : 0} người đã nhập</td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteCode('${codeStr}')">Hủy Mã Này</button>
                            </td>
                        </tr>
                    `;
                });

                if(!hasData) html = '<tr><td colspan="4" style="color:#888;">Chưa tạo mã code nào. Bấm Tạo Mã ngay!</td></tr>';
                tbody.innerHTML = html;
            });
        }

        function addPromoCode() {
            const code = prompt("Nhập mã Code bạn muốn tạo (Ví dụ: VIP2026, TANTHU...):");
            if (!code) return;
            
            // Xóa dấu cách và viết hoa toàn bộ cho chuẩn
            const cleanCode = code.replace(/\s+/g, '').toUpperCase();
            
            const amount = prompt(`Mã [${cleanCode}] này sẽ cho bao nhiêu tiền $?`, "100");
            if (!amount || isNaN(amount)) return;

            // Lưu lên máy chủ
            database.ref(`blockblast/codes/${cleanCode}`).set({
                amount: parseInt(amount),
                createdAt: Date.now()
            }).then(() => {
                alert(`✅ Đã tạo mã ${cleanCode} trị giá ${amount}$ thành công!`);
                loadCodes();
            });
        }

        function deleteCode(code) {
            if(confirm(`⚠️ Bạn có chắc muốn xóa mã ${code} không? Người chơi sẽ không thể nhập mã này nữa.`)) {
                database.ref(`blockblast/codes/${code}`).remove().then(() => {
                    loadCodes();
                });
            }
        }
    </script>
</body>
</html>
